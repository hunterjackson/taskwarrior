name: Build AppImage

on:
  push:
    branches:
      - stable
  pull_request:
    branches:
      - stable
  workflow_dispatch:
    # Allow manual triggering

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version info
        id: version
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Build AppImage in Ubuntu 18.04 container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e DEBIAN_FRONTEND=noninteractive \
            -e GIT_COMMIT=${{ steps.version.outputs.commit }} \
            ubuntu:18.04 \
            bash -c '
              set -e

              # Install build dependencies
              apt-get update -y
              apt-get install -y \
                build-essential \
                binutils \
                uuid-dev \
                curl \
                wget \
                file \
                libfuse2 \
                ca-certificates \
                pkg-config \
                libssl-dev \
                gnupg \
                software-properties-common \
                git

              # Install modern CMake from Kitware
              wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null
              echo "deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ bionic main" | tee /etc/apt/sources.list.d/kitware.list >/dev/null
              apt-get update -y
              apt-get install -y cmake ninja-build

              # Install Rust
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
              export PATH="$HOME/.cargo/bin:$PATH"
              export CARGO_HOME=/root/.cargo
              export RUSTUP_HOME=/root/.rustup

              # Configure CMake
              cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"

              # Build
              cmake --build build

              # Strip binaries
              strip --strip-all build/src/task

              # Install to AppDir
              DESTDIR=/workspace/AppDir cmake --install build

              # Download and extract linuxdeploy
              wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
              chmod +x linuxdeploy-x86_64.AppImage
              ./linuxdeploy-x86_64.AppImage --appimage-extract

              # Create AppImage desktop file
              mkdir -p AppDir/usr/share/applications
              printf "%s\n" \
                "[Desktop Entry]" \
                "Type=Application" \
                "Name=Taskwarrior" \
                "Comment=Command-line task list manager" \
                "Exec=task" \
                "Icon=taskwarrior" \
                "Terminal=true" \
                "Categories=Utility;ConsoleOnly;" \
                > AppDir/usr/share/applications/taskwarrior.desktop

              # Create AppImage icon
              mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
              wget -q -O AppDir/usr/share/icons/hicolor/256x256/apps/taskwarrior.png \
                https://avatars.githubusercontent.com/u/36100920?s=256 || \
                echo "Icon download failed, continuing anyway"

              # Build AppImage
              ARCH=x86_64 ./squashfs-root/AppRun \
                --appdir AppDir \
                --output appimage \
                --desktop-file=AppDir/usr/share/applications/taskwarrior.desktop \
                --icon-file=AppDir/usr/share/icons/hicolor/256x256/apps/taskwarrior.png \
                --executable=AppDir/usr/bin/task

              # Rename AppImage
              VERSION=$(grep "PROJECT_VERSION:STATIC" build/CMakeCache.txt | cut -d"=" -f2 | tr -d " \n\r")
              echo "Detected version: $VERSION"
              echo "Git commit: $GIT_COMMIT"

              # List what we have
              ls -la *.AppImage || echo "No AppImage files found"

              # Find the generated AppImage and rename it
              for appimage in *.AppImage; do
                if [ -f "$appimage" ]; then
                  echo "Renaming $appimage to taskwarrior-${VERSION}-${GIT_COMMIT}-x86_64.AppImage"
                  mv "$appimage" "taskwarrior-${VERSION}-${GIT_COMMIT}-x86_64.AppImage"
                  break
                fi
              done

              # Make AppImage executable
              chmod +x taskwarrior-*.AppImage

              # Test AppImage
              ./taskwarrior-*.AppImage --version || echo "Version check failed but continuing"
            '

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: taskwarrior-appimage
          path: '*.AppImage'
          if-no-files-found: error

      - name: Build Summary
        run: |
          echo "### AppImage Build Completed :package:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "AppImage built successfully!" >> $GITHUB_STEP_SUMMARY
          ls -lh *.AppImage >> $GITHUB_STEP_SUMMARY

  test-compatibility:
    needs: build-appimage
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu LTS - currently supported versions only
          - name: "Ubuntu 22.04 (Jammy)"
            image: "ubuntu:22.04"
            category: "ubuntu-lts"
          - name: "Ubuntu 24.04 (Noble)"
            image: "ubuntu:24.04"
            category: "ubuntu-lts"

          # Debian - current stable and oldstable
          - name: "Debian 11 (Bullseye)"
            image: "debian:bullseye"
            category: "debian"
          - name: "Debian 12 (Bookworm)"
            image: "debian:bookworm"
            category: "debian"

          # Fedora - current and previous release
          - name: "Fedora 40"
            image: "fedora:40"
            category: "fedora"
          - name: "Fedora 41"
            image: "fedora:41"
            category: "fedora"

          # RHEL/CentOS family
          - name: "CentOS Stream 9"
            image: "quay.io/centos/centos:stream9"
            category: "rhel"
          - name: "Rocky Linux 8"
            image: "rockylinux:8"
            category: "rhel"
          - name: "Rocky Linux 9"
            image: "rockylinux:9"
            category: "rhel"
          - name: "AlmaLinux 8"
            image: "almalinux:8"
            category: "rhel"
          - name: "AlmaLinux 9"
            image: "almalinux:9"
            category: "rhel"

          # Rolling releases
          - name: "Arch Linux"
            image: "archlinux:latest"
            category: "rolling"
          - name: "OpenSUSE Tumbleweed"
            image: "opensuse/tumbleweed:latest"
            category: "rolling"

    steps:
      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: taskwarrior-appimage

      - name: Test AppImage on ${{ matrix.name }}
        id: test
        continue-on-error: true
        run: |
          chmod +x *.AppImage
          APPIMAGE=$(ls -1 *.AppImage | head -1)

          echo "Testing $APPIMAGE on ${{ matrix.name }}"

          # Test in container
          docker run --rm \
            -v $(pwd):/test \
            -w /test \
            ${{ matrix.image }} \
            bash -c '
              # Install FUSE if needed for AppImage extraction
              if command -v apt-get &> /dev/null; then
                apt-get update -qq && apt-get install -qq -y libfuse2 > /dev/null 2>&1 || true
              elif command -v dnf &> /dev/null; then
                dnf install -y fuse-libs > /dev/null 2>&1 || true
              elif command -v yum &> /dev/null; then
                yum install -y fuse-libs > /dev/null 2>&1 || true
              elif command -v zypper &> /dev/null; then
                zypper install -y fuse > /dev/null 2>&1 || true
              elif command -v pacman &> /dev/null; then
                pacman -Sy --noconfirm fuse2 > /dev/null 2>&1 || true
              fi

              # Try to run AppImage
              chmod +x '"$APPIMAGE"'
              echo "=== Testing --version ==="
              ./'"$APPIMAGE"' --version || exit 1

              echo "=== Testing --help ==="
              ./'"$APPIMAGE"' --help || exit 1

              echo "=== Testing basic task command ==="
              ./'"$APPIMAGE"' rc.data.location=/tmp/tasktest rc.confirmation=no add Test task || exit 1
              ./'"$APPIMAGE"' rc.data.location=/tmp/tasktest list || exit 1

              echo "All tests passed!"
            ' && echo "result=success" >> $GITHUB_OUTPUT || echo "result=failed" >> $GITHUB_OUTPUT

      - name: Record result
        if: always()
        run: |
          mkdir -p test-results
          if [ "${{ steps.test.outputs.result }}" = "success" ]; then
            echo "✅ PASS" > test-results/${{ matrix.category }}-${{ strategy.job-index }}.txt
          else
            echo "❌ FAIL" > test-results/${{ matrix.category }}-${{ strategy.job-index }}.txt
          fi
          echo "${{ matrix.name }}" >> test-results/${{ matrix.category }}-${{ strategy.job-index }}.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-result-${{ strategy.job-index }}
          path: test-results/

  report-results:
    needs: test-compatibility
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-result-*
          path: all-results
          merge-multiple: true

      - name: Generate compatibility report
        run: |
          echo "## 🧪 AppImage Compatibility Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Built on **Ubuntu 18.04** for maximum compatibility" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count results
          TOTAL=$(find all-results -name "*.txt" | wc -l)
          PASSED=$(grep -l "✅" all-results/*.txt 2>/dev/null | wc -l)
          FAILED=$(grep -l "❌" all-results/*.txt 2>/dev/null | wc -l)

          echo "### Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Tested**: $TOTAL distributions" >> $GITHUB_STEP_SUMMARY
          echo "- **Passed**: $PASSED ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed**: $FAILED ❌" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Group by category
          echo "### Results by Distribution Family" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for category in ubuntu-lts debian fedora rhel rolling; do
            FILES=$(find all-results -name "${category}-*.txt" 2>/dev/null)
            if [ -n "$FILES" ]; then
              case $category in
                ubuntu-lts) echo "#### Ubuntu LTS" ;;
                debian) echo "#### Debian" ;;
                fedora) echo "#### Fedora" ;;
                rhel) echo "#### RHEL/CentOS/Rocky/Alma" ;;
                rolling) echo "#### Rolling Release" ;;
              esac >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              for file in $FILES; do
                STATUS=$(head -1 "$file")
                DISTRO=$(tail -1 "$file")
                echo "- $STATUS $DISTRO" >> $GITHUB_STEP_SUMMARY
              done
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

          # Show failures in detail if any
          if [ $FAILED -gt 0 ]; then
            echo "### ⚠️ Failed Distributions" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The following distributions failed compatibility tests:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            grep -l "❌" all-results/*.txt | while read file; do
              DISTRO=$(tail -1 "$file")
              echo "- $DISTRO" >> $GITHUB_STEP_SUMMARY
            done
          fi
